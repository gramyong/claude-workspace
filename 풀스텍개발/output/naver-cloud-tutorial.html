<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>클라우드 인프라 구성 튜토리얼</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--card:#161b22;--card2:#1c2128;--border:#30363d;--text:#e6edf3;--text2:#8b949e;
  --accent:#03C75A;--accent2:#02a34d;--aws:#FF9900;--aws2:#e68a00;
  --danger:#f85149;--warn:#d29922;--success:#3fb950;
  --sidebar:280px;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
/* TOP BAR */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:#0d1117ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;z-index:100;gap:16px}
.topbar h1{font-size:18px;font-weight:700;color:var(--accent);white-space:nowrap}
.topbar h1 span{color:var(--text)}
.provider-toggle{display:flex;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-left:auto}
.provider-btn{padding:6px 18px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text2);transition:all .2s}
.provider-btn.active.ncp{background:var(--accent);color:#fff}
.provider-btn.active.aws{background:var(--aws);color:#fff}
.progress-wrap{display:flex;align-items:center;gap:10px;margin-left:16px}
.progress-label{font-size:12px;color:var(--text2);white-space:nowrap}
.progress-bar{width:120px;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .5s}
.progress-fill.aws-mode{background:var(--aws)}
/* LAYOUT */
.layout{display:flex;padding-top:56px;min-height:100vh}
/* SIDEBAR */
.sidebar{width:var(--sidebar);position:fixed;top:56px;left:0;bottom:0;background:var(--card);border-right:1px solid var(--border);overflow-y:auto;padding:16px 0}
.sidebar-title{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.08em;padding:0 16px 8px;text-transform:uppercase}
.mission-item{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;cursor:pointer;transition:background .15s;border-left:3px solid transparent;margin-bottom:2px}
.mission-item:hover:not(.locked){background:var(--card2)}
.mission-item.active{background:var(--card2);border-left-color:var(--accent)}
.mission-item.active.aws-mode{border-left-color:var(--aws)}
.mission-item.cleared{opacity:.85}
.mission-item.locked{opacity:.45;cursor:not-allowed}
.mission-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.mission-info{flex:1;min-width:0}
.mission-name{font-size:13px;font-weight:600;line-height:1.3}
.mission-sub{font-size:11px;color:var(--text2);margin-top:2px;line-height:1.4}
.mission-badge{font-size:10px;padding:1px 6px;border-radius:10px;background:#238636;color:#fff;margin-top:4px;display:inline-block}
.mission-badge.locked{background:var(--border);color:var(--text2)}
/* MAIN */
.main{margin-left:var(--sidebar);flex:1;padding:24px;max-width:1200px}
.mission-header{margin-bottom:20px}
.mission-title-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.mission-num{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--accent);color:#fff}
.mission-num.aws-mode{background:var(--aws)}
.mission-title{font-size:22px;font-weight:700}
.mission-desc{color:var(--text2);font-size:14px;line-height:1.6}
/* ARCH DIAGRAM */
.arch-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
.arch-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:16px;letter-spacing:.05em}
.arch-diagram{display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:wrap;min-height:80px}
.arch-node{display:flex;flex-direction:column;align-items:center;gap:4px}
.arch-node-box{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;border:2px solid;text-align:center;min-width:80px}
.arch-node-box.internet{border-color:#58a6ff;background:#58a6ff22;color:#58a6ff}
.arch-node-box.web{border-color:var(--accent);background:#03C75A22;color:var(--accent)}
.arch-node-box.was{border-color:#d2a8ff;background:#d2a8ff22;color:#d2a8ff}
.arch-node-box.db{border-color:var(--warn);background:#d2992222;color:var(--warn)}
.arch-node-box.lb{border-color:#58a6ff;background:#58a6ff22;color:#58a6ff}
.arch-node-box.redis{border-color:#f85149;background:#f8514922;color:#f85149}
.arch-node-box.cdn{border-color:#79c0ff;background:#79c0ff22;color:#79c0ff}
.arch-node-box.monitor{border-color:#56d364;background:#56d36422;color:#56d364}
.arch-node-label{font-size:10px;color:var(--text2)}
.arch-arrow{font-size:18px;color:var(--border);margin:0 4px;align-self:center}
.arch-group{display:flex;flex-direction:column;gap:6px;align-items:center}
.arch-group-label{font-size:10px;color:var(--text2);text-align:center}
/* TECH SELECTORS */
.selectors-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.selector-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.selector-label{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.06em;margin-bottom:10px;text-transform:uppercase}
.tech-cards{display:flex;flex-direction:column;gap:6px}
.tech-card{border:2px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .2s;background:var(--card2)}
.tech-card:hover{border-color:var(--accent)}
.tech-card.selected{border-color:var(--accent);background:#03C75A15}
.tech-card.selected.aws-mode{border-color:var(--aws);background:#FF990015}
.tech-card-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.tech-name{font-size:13px;font-weight:600}
.tech-badge{font-size:10px;padding:1px 7px;border-radius:10px;background:#9e6a03;color:#ffc;font-weight:600}
.tech-badge.recommended{background:#1a7f37;color:#acf2bd}
.tech-features{font-size:11px;color:var(--text2);line-height:1.6}
.tech-usecase{font-size:11px;color:var(--text2);margin-top:4px;font-style:italic}
/* GUIDE TABS */
.guide-box{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px}
.guide-tabs{display:flex;border-bottom:1px solid var(--border)}
.guide-tab{padding:12px 20px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none}
.guide-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.guide-tab.active.aws-mode{color:var(--aws);border-bottom-color:var(--aws)}
.guide-content{padding:20px;display:none}
.guide-content.active{display:block}
.guide-step{margin-bottom:20px}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;margin-right:8px;flex-shrink:0}
.step-num.aws-mode{background:var(--aws)}
.step-title{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;align-items:center}
.step-desc{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:8px;margin-left:30px}
/* CODE BLOCKS */
.code-block{position:relative;background:#010409;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:8px 0 8px 30px}
.code-header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--card2);border-bottom:1px solid var(--border)}
.code-lang{font-size:11px;color:var(--text2)}
.copy-btn{font-size:11px;padding:3px 10px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .2s}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.copy-btn.copied{border-color:var(--success);color:var(--success)}
pre{padding:14px;font-size:12px;line-height:1.7;overflow-x:auto;color:#e6edf3}
pre .comment{color:#8b949e}
pre .keyword{color:#ff7b72}
pre .string{color:#a5d6ff}
pre .cmd{color:#79c0ff}
/* CHECKLIST */
.checklist-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
.checklist-title{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.checklist-progress{font-size:12px;color:var(--text2);margin-left:auto}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer}
.check-item:last-child{border-bottom:none}
.check-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;margin-top:2px}
.check-item label{font-size:13px;line-height:1.5;cursor:pointer;color:var(--text)}
.check-item.checked label{color:var(--text2);text-decoration:line-through}
.clear-btn{width:100%;padding:14px;font-size:15px;font-weight:700;border-radius:10px;border:none;cursor:pointer;transition:all .3s;background:var(--border);color:var(--text2)}
.clear-btn.ready{background:var(--accent);color:#fff;box-shadow:0 0 20px #03C75A55}
.clear-btn.ready.aws-mode{background:var(--aws);box-shadow:0 0 20px #FF990055}
.clear-btn.ready:hover{transform:translateY(-2px)}
/* MISSION CLEAR OVERLAY */
.clear-overlay{position:fixed;inset:0;background:#0d111799;backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center}
.clear-overlay.show{display:flex}
.clear-card{background:var(--card);border:2px solid var(--accent);border-radius:20px;padding:48px;text-align:center;max-width:480px;animation:popIn .4s ease-out}
.clear-card.aws-mode{border-color:var(--aws)}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.clear-icon{font-size:64px;margin-bottom:16px}
.clear-title{font-size:32px;font-weight:900;color:var(--accent);letter-spacing:.05em;margin-bottom:8px}
.clear-title.aws-mode{color:var(--aws)}
.clear-sub{font-size:16px;color:var(--text2);margin-bottom:24px}
.clear-next-btn{padding:12px 32px;font-size:15px;font-weight:700;border-radius:10px;border:none;background:var(--accent);color:#fff;cursor:pointer;margin-right:10px}
.clear-next-btn.aws-mode{background:var(--aws)}
.clear-close-btn{padding:12px 32px;font-size:15px;font-weight:700;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}
/* STARS */
.stars{display:flex;justify-content:center;gap:6px;margin-bottom:20px}
.star{font-size:32px;opacity:.3;transition:opacity .3s}
.star.lit{opacity:1}
/* NOTES */
.note{background:#1c2128;border-left:3px solid var(--warn);border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0 8px 30px;font-size:12px;color:var(--text2);line-height:1.6}
.note strong{color:var(--warn)}
/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#484f58}
/* RESPONSIVE */
@media(max-width:1024px){
  .selectors-grid{grid-template-columns:1fr}
  .main{padding:16px}
}
.hidden{display:none!important}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;background:var(--card2);border:1px solid var(--border);color:var(--text2);margin-right:4px}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <h1>☁️ <span>클라우드 인프라</span> 미션</h1>
  <div class="provider-toggle">
    <button class="provider-btn active ncp" onclick="setProvider('ncp')">Naver Cloud Platform</button>
    <button class="provider-btn aws" onclick="setProvider('aws')">AWS</button>
  </div>
  <div class="progress-wrap">
    <span class="progress-label" id="progressLabel">0 / 7 완료</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-title">미션 목록</div>
  <!-- Mission items injected by JS -->
</div>

<!-- MAIN -->
<div class="main" id="mainArea">
  <!-- Content injected by JS -->
</div>

</div>

<!-- MISSION CLEAR OVERLAY -->
<div class="clear-overlay" id="clearOverlay">
  <div class="clear-card" id="clearCard">
    <div class="stars" id="clearStars">
      <span class="star" id="s1">⭐</span>
      <span class="star" id="s2">⭐</span>
      <span class="star" id="s3">⭐</span>
    </div>
    <div class="clear-icon">🏆</div>
    <div class="clear-title" id="clearTitle">MISSION CLEAR!</div>
    <div class="clear-sub" id="clearSub">미션을 완료했습니다!</div>
    <button class="clear-next-btn" id="clearNextBtn" onclick="goNextMission()">다음 미션 →</button>
    <button class="clear-close-btn" onclick="closeClearOverlay()">닫기</button>
  </div>
</div>

<script>
// ===================== DATA =====================
const MISSIONS = [
  {id:1, name:'단중화 구성', sub:'Web + WAS + DB 1대씩', icon:'🖥️'},
  {id:2, name:'이중화 구성', sub:'이중화 + Load Balancer', icon:'⚖️'},
  {id:3, name:'세션 유지 구성', sub:'이중화 + Redis', icon:'💾'},
  {id:4, name:'SSL/HTTPS 구성', sub:'인증서 발급 + HTTPS', icon:'🔒'},
  {id:5, name:'오토스케일링 구성', sub:'Auto Scaling', icon:'📈'},
  {id:6, name:'모니터링 구성', sub:'메트릭 + 알람', icon:'📊'},
  {id:7, name:'CDN 구성', sub:'정적 리소스 최적화', icon:'🌐'},
];

const OS_OPTIONS = [
  {id:'rocky', name:'Rocky Linux 8', features:['RHEL 호환 엔터프라이즈 리눅스','SELinux 기본 활성화','dnf 패키지 매니저','장기 지원(LTS) 제공'], usecase:'엔터프라이즈 환경, CentOS 대체용으로 적합'},
  {id:'ubuntu', name:'Ubuntu 22.04 LTS', features:['가장 넓은 생태계 지원','apt 패키지 매니저','2027년까지 공식 지원','클라우드 이미지 최적화'], usecase:'범용 서버, 개발환경, 스타트업에 적합'},
];
const WEB_OPTIONS = [
  {id:'apache', name:'Apache 2.4', features:['.htaccess 지원','mod_rewrite URL 재작성','다양한 모듈 생태계','AJP 프로토콜 지원'], usecase:'전통적인 웹 서버, Tomcat과 AJP 연동 시 최적'},
  {id:'nginx', name:'Nginx 1.24', features:['고성능 이벤트 기반 아키텍처','리버스 프록시/로드밸런서','정적 파일 고속 처리','낮은 메모리 사용량'], usecase:'고트래픽 환경, 마이크로서비스 프록시에 적합'},
];
const WAS_OPTIONS = [
  {id:'tomcat', name:'Apache Tomcat 10.1', features:['Jakarta EE 10 서블릿 컨테이너','가볍고 빠른 시작','넓은 커뮤니티 지원','Spring Boot 기본 내장 서버'], usecase:'Java 웹 애플리케이션, Spring Framework 배포'},
  {id:'wildfly', name:'WildFly 31 (JBoss)', features:['Jakarta EE 완전 구현','EJB, CDI, JPA 지원','관리 콘솔 제공','도메인 모드 클러스터링'], usecase:'엔터프라이즈 Java EE 앱, 복잡한 비즈니스 로직'},
];
const DB_OPTIONS = [
  {id:'mysql', name:'MySQL 8.0', features:['가장 널리 사용되는 RDBMS','InnoDB 스토리지 엔진','JSON 데이터 타입 지원','활발한 생태계'], usecase:'웹 애플리케이션, LAMP/LEMP 스택'},
  {id:'postgresql', name:'PostgreSQL 16', features:['고급 SQL 표준 준수','복잡한 쿼리 최적화','JSONB 고성능 처리','확장성 및 안정성'], usecase:'복잡한 데이터 모델, 분석 쿼리, WildFly와 조합'},
  {id:'mariadb', name:'MariaDB 10.11', features:['MySQL 완전 호환 포크','Aria 스토리지 엔진','갈레라 클러스터 지원','오픈소스 100%'], usecase:'MySQL 대체, 멀티 마스터 클러스터링'},
];

// ===================== STATE =====================
let state = {
  provider: 'ncp',
  currentMission: 1,
  cleared: [],
  selections: {os:'rocky', web:'apache', was:'tomcat', db:'mysql'},
  checks: {},
  guideTab: 'console',
};

function loadState() {
  try {
    const s = localStorage.getItem('cloudTutorialState');
    if (s) {
      const parsed = JSON.parse(s);
      state = Object.assign(state, parsed);
    }
  } catch(e){}
}

function saveState() {
  try { localStorage.setItem('cloudTutorialState', JSON.stringify(state)); } catch(e){}
}

// ===================== PROVIDER =====================
function setProvider(p) {
  state.provider = p;
  saveState();
  document.querySelectorAll('.provider-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.provider-btn.' + p).classList.add('active');
  applyProviderTheme();
  renderAll();
}

function applyProviderTheme() {
  const isAws = state.provider === 'aws';
  document.documentElement.style.setProperty('--accent', isAws ? '#FF9900' : '#03C75A');
  document.documentElement.style.setProperty('--accent2', isAws ? '#e68a00' : '#02a34d');
  document.querySelectorAll('.aws-mode-el').forEach(el => {
    el.classList.toggle('aws-mode', isAws);
  });
}

// ===================== RECOMMENDATION =====================
function getRecommendations() {
  const {web, was, db} = state.selections;
  let recWas = null, recDb = null;
  // Web → WAS
  if (web === 'apache' || web === 'nginx') recWas = 'tomcat';
  // WAS → DB
  if (was === 'tomcat' && web === 'apache') recDb = 'mysql';
  else if (was === 'tomcat' && web === 'nginx') recDb = 'postgresql';
  else if (was === 'wildfly') recDb = 'postgresql';
  return {recWas, recDb};
}

// ===================== RENDER SIDEBAR =====================
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  const isAws = state.provider === 'aws';
  let html = '<div class="sidebar-title">미션 목록</div>';
  MISSIONS.forEach((m, i) => {
    const cleared = state.cleared.includes(m.id);
    const active = state.currentMission === m.id;
    const locked = m.id > 1 && !state.cleared.includes(m.id - 1) && !cleared && !active;
    let cls = 'mission-item';
    if (locked) cls += ' locked';
    else if (cleared) cls += ' cleared';
    if (active) cls += ' active' + (isAws ? ' aws-mode' : '');
    let icon = locked ? '🔒' : cleared ? '✅' : active ? '▶️' : '⏸️';
    let badge = locked ? '<span class="mission-badge locked">잠김</span>' : cleared ? '<span class="mission-badge">완료</span>' : active ? '<span class="mission-badge" style="background:#1d3a5f;color:#79c0ff">진행중</span>' : '';
    html += `<div class="${cls}" onclick="selectMission(${m.id})">
      <div class="mission-icon">${icon}</div>
      <div class="mission-info">
        <div class="mission-name">미션 ${m.id}. ${m.name}</div>
        <div class="mission-sub">${m.sub}</div>
        ${badge}
      </div>
    </div>`;
  });
  sb.innerHTML = html;
}

function selectMission(id) {
  const m = MISSIONS[id - 1];
  const locked = id > 1 && !state.cleared.includes(id - 1) && !state.cleared.includes(id);
  if (locked) return;
  state.currentMission = id;
  saveState();
  renderSidebar();
  renderMain();
}

// ===================== PROGRESS BAR =====================
function renderProgress() {
  const n = state.cleared.length;
  document.getElementById('progressLabel').textContent = n + ' / 7 완료';
  document.getElementById('progressFill').style.width = (n/7*100) + '%';
  const isAws = state.provider === 'aws';
  document.getElementById('progressFill').className = 'progress-fill' + (isAws ? ' aws-mode' : '');
}

// ===================== ARCHITECTURE DIAGRAMS =====================

// ===================== CODE BLOCK HELPER =====================
let codeBlockIndex = 0;
function codeBlock(lang, code) {
  const idx = ++codeBlockIndex;
  const escaped = code.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="code-block">
    <div class="code-header">
      <span class="code-lang">${lang}</span>
      <button class="copy-btn" onclick="copyCode(this, ${idx})">복사</button>
    </div>
    <pre id="code_${idx}">${escaped}</pre>
  </div>`;
}
function copyCode(btn, idx) {
  const pre = document.getElementById('code_' + idx);
  navigator.clipboard.writeText(pre.innerText).then(() => {
    btn.textContent = '✓ 복사됨';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 2000);
  });
}

// ===================== GUIDE CONTENT =====================
function getInstallCommands() {
  const {os, web, was, db} = state.selections;
  const isRocky = os === 'rocky';

  const webInstall = isRocky
    ? (web === 'apache'
        ? `sudo dnf install -y httpd\nsudo systemctl enable --now httpd\nsudo firewall-cmd --permanent --add-service=http --add-service=https\nsudo firewall-cmd --reload`
        : `sudo dnf install -y nginx\nsudo systemctl enable --now nginx\nsudo firewall-cmd --permanent --add-service=http --add-service=https\nsudo firewall-cmd --reload`)
    : (web === 'apache'
        ? `sudo apt update && sudo apt install -y apache2\nsudo systemctl enable --now apache2\nsudo ufw allow 'Apache Full'`
        : `sudo apt update && sudo apt install -y nginx\nsudo systemctl enable --now nginx\nsudo ufw allow 'Nginx Full'`);

  const javaInstall = isRocky
    ? `sudo dnf install -y java-17-openjdk`
    : `sudo apt install -y openjdk-17-jdk`;

  const wasInstall = was === 'tomcat'
    ? `${javaInstall}\n\ncd /opt\nsudo wget https://downloads.apache.org/tomcat/tomcat-10/v10.1.28/bin/apache-tomcat-10.1.28.tar.gz\nsudo tar -xzf apache-tomcat-10.1.28.tar.gz\nsudo mv apache-tomcat-10.1.28 tomcat\nsudo useradd -r -m -U -d /opt/tomcat -s /bin/false tomcat\nsudo chown -R tomcat: /opt/tomcat\n# Tomcat 시작\nsudo /opt/tomcat/bin/startup.sh`
    : `${javaInstall}\n\ncd /opt\nsudo wget https://github.com/wildfly/wildfly/releases/download/31.0.0.Final/wildfly-31.0.0.Final.tar.gz\nsudo tar -xzf wildfly-31.0.0.Final.tar.gz\nsudo mv wildfly-31.0.0.Final wildfly\nsudo useradd -r -s /sbin/nologin wildfly\nsudo chown -R wildfly: /opt/wildfly\n# WildFly 시작\nsudo /opt/wildfly/bin/standalone.sh -b 0.0.0.0`;

  let dbInstall = '';
  if (db === 'mysql') {
    dbInstall = isRocky
      ? `sudo dnf install -y mysql-server\nsudo systemctl enable --now mysqld\nsudo mysql_secure_installation`
      : `sudo apt install -y mysql-server\nsudo mysql_secure_installation`;
  } else if (db === 'postgresql') {
    dbInstall = isRocky
      ? `sudo dnf install -y postgresql-server\nsudo postgresql-setup --initdb\nsudo systemctl enable --now postgresql`
      : `sudo apt install -y postgresql postgresql-contrib\nsudo systemctl enable --now postgresql`;
  } else {
    dbInstall = isRocky
      ? `sudo dnf install -y mariadb-server\nsudo systemctl enable --now mariadb\nsudo mysql_secure_installation`
      : `sudo apt install -y mariadb-server\nsudo mysql_secure_installation`;
  }

  const integrationCmd = was === 'tomcat'
    ? (web === 'apache'
        ? (isRocky
            ? `# AJP 연동 설정 (Rocky Linux)\ncat << 'EOF' | sudo tee /etc/httpd/conf.d/tomcat.conf\n<VirtualHost *:80>\n    ProxyPreserveHost On\n    ProxyPass / ajp://WAS_PRIVATE_IP:8009/\n    ProxyPassReverse / ajp://WAS_PRIVATE_IP:8009/\n</VirtualHost>\nEOF\nsudo systemctl restart httpd`
            : `# AJP 연동 설정 (Ubuntu)\nsudo a2enmod proxy_ajp\ncat << 'EOF' | sudo tee /etc/apache2/sites-available/tomcat.conf\n<VirtualHost *:80>\n    ProxyPreserveHost On\n    ProxyPass / ajp://WAS_PRIVATE_IP:8009/\n    ProxyPassReverse / ajp://WAS_PRIVATE_IP:8009/\n</VirtualHost>\nEOF\nsudo a2ensite tomcat.conf\nsudo systemctl restart apache2`)
        : `# Nginx Reverse Proxy 설정\ncat << 'EOF' | sudo tee /etc/nginx/conf.d/tomcat.conf\nupstream tomcat_backend {\n    server WAS_PRIVATE_IP:8080;\n}\nserver {\n    listen 80;\n    server_name your_domain.com;\n    location / {\n        proxy_pass http://tomcat_backend;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    }\n}\nEOF\nsudo nginx -t && sudo systemctl restart nginx`)
    : (web === 'apache'
        ? `# Apache → WildFly HTTP 연동\ncat << 'EOF' | sudo tee /etc/httpd/conf.d/wildfly.conf\n<VirtualHost *:80>\n    ProxyPreserveHost On\n    ProxyPass / http://WAS_PRIVATE_IP:8080/\n    ProxyPassReverse / http://WAS_PRIVATE_IP:8080/\n</VirtualHost>\nEOF\nsudo systemctl restart httpd`
        : `# Nginx → WildFly 연동\ncat << 'EOF' | sudo tee /etc/nginx/conf.d/wildfly.conf\nupstream wildfly_backend {\n    server WAS_PRIVATE_IP:8080;\n}\nserver {\n    listen 80;\n    location / {\n        proxy_pass http://wildfly_backend;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n    }\n}\nEOF\nsudo nginx -t && sudo systemctl restart nginx`);

  return { webInstall, wasInstall, dbInstall, integrationCmd };
}

// ===================== RENDER MAIN =====================
function renderMain() {
  codeBlockIndex = 0;
  const m = MISSIONS[state.currentMission - 1];
  const isAws = state.provider === 'aws';
  const modeClass = isAws ? ' aws-mode' : '';
  const checks = state.checks[state.currentMission] || {};
  const checklist = CHECKLISTS[state.currentMission];
  const checkedCount = checklist.filter((_, i) => checks[i]).length;
  const allChecked = checkedCount === checklist.length;

  let guideHtml = '';
  const tab = state.guideTab;

  switch(state.currentMission) {
    case 1:
      guideHtml = tab === 'console' ? getMission1ConsoleHtml() : getMission1CliHtml();
      break;
    case 2:
      guideHtml = getMission2Html(tab);
      break;
    case 3:
      guideHtml = getMission3Html(tab);
      break;
    case 4:
      guideHtml = getMission4Html(tab);
      break;
    case 5:
      guideHtml = getMission5Html(tab);
      break;
    case 6:
      guideHtml = getMission6Html(tab);
      break;
    case 7:
      guideHtml = getMission7Html(tab);
      break;
  }

  const checklistHtml = checklist.map((item, i) =>
    `<div class="check-item${checks[i] ? ' checked' : ''}" onclick="toggleCheck(${i})">
      <input type="checkbox" ${checks[i] ? 'checked' : ''} onchange="toggleCheck(${i})" onclick="event.stopPropagation()">
      <label>${item}</label>
    </div>`
  ).join('');

  const mainArea = document.getElementById('mainArea');
  mainArea.innerHTML = `
    <div class="mission-header">

// ===================== CHECKLIST =====================
function toggleCheck(idx) {
  if (!state.checks[state.currentMission]) state.checks[state.currentMission] = {};
  state.checks[state.currentMission][idx] = !state.checks[state.currentMission][idx];
  saveState();
  renderMain();

// ===================== MISSION CLEAR =====================
function triggerMissionClear() {
  const isAws = state.provider === 'aws';
  // Play sound
  playBeep();
  // Show overlay
  const overlay = document.getElementById('clearOverlay');
  const card = document.getElementById('clearCard');
  const title = document.getElementById('clearTitle');
  card.className = 'clear-card' + (isAws ? ' aws-mode' : '');
  title.className = 'clear-title' + (isAws ? ' aws-mode' : '');
  document.getElementById('clearSub').textContent = `미션 ${state.currentMission}: ${MISSIONS[state.currentMission-1].name} 완료!`;
  document.getElementById('clearNextBtn').className = 'clear-next-btn' + (isAws ? ' aws-mode' : '');
  document.getElementById('clearNextBtn').style.display = state.currentMission < 7 ? '' : 'none';
  overlay.classList.add('show');

  // Star animation
  ['s1','s2','s3'].forEach((id, i) => {
    setTimeout(() => { document.getElementById(id).classList.add('lit'); }, i * 300 + 200);
  });

  // Mark cleared
  if (!state.cleared.includes(state.currentMission)) {
    state.cleared.push(state.currentMission);
    saveState();
  }
  renderProgress();
  renderSidebar();
}

function closeClearOverlay() {
  document.getElementById('clearOverlay').classList.remove('show');
  ['s1','s2','s3'].forEach(id => document.getElementById(id).classList.remove('lit'));
}

function goNextMission() {
  const next = state.currentMission + 1;
  if (next <= 7) {
    closeClearOverlay();
    selectMission(next);
  }
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523, 659, 784, 1047];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.15);
      osc.start(ctx.currentTime + i * 0.1);
      osc.stop(ctx.currentTime + i * 0.1 + 0.2);
    });
  } catch(e) {}
}

// ===================== RENDER ALL =====================
function renderAll() {
  renderProgress();
  renderSidebar();
  renderMain();
}
